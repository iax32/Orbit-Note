name: orbit_note
description: "Orbit Note, an open-source local-first personal knowledge operating system."
publish_to: 'none'
version: 1.0.13+14

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.5.0
  crypto: ^3.0.7
  desktop_drop: ^0.8.4
  drift: ^2.34.4
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  flutter_svg: ^2.3.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.1
  google_sign_in: ^7.2.0
  highlight: ^0.7.0
  http: ^1.6.0
  markdown: ^7.3.1
  pasteboard: ^0.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfium_dart: ^0.2.5
  pdfrx:
    path: third_party/pdfrx
  sqlite3: ^3.5.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  watcher: 1.2.1
  web: ^1.1.1
  yaml: ^3.1.4
  yaml_edit: ^2.2.4

dependency_overrides:
  pdfrx_engine:
    path: third_party/pdfrx_engine

dev_dependencies:
  vm_service: ^15.3.0
  pdfrx_engine: ^0.4.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/publishing/
    - assets/writing/
  fonts:
    - family: OrbitPixel
      fonts:
        - asset: assets/writing/Tiny5.ttf
    - family: OrbitTerminal
      fonts:
        - asset: assets/writing/SpaceMono-Regular.ttf
        - asset: assets/writing/SpaceMono-Bold.ttf
          weight: 700
        - asset: assets/writing/SpaceMono-Italic.ttf
          style: italic
        - asset: assets/writing/SpaceMono-BoldItalic.ttf
          weight: 700
          style: italic
    - family: OrbitBook
      fonts:
        - asset: assets/publishing/CrimsonText-Regular.ttf
        - asset: assets/publishing/CrimsonText-Bold.ttf
          weight: 700
        - asset: assets/publishing/CrimsonText-Italic.ttf
          style: italic
        - asset: assets/publishing/CrimsonText-BoldItalic.ttf
          weight: 700
          style: italic
