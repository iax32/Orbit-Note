name: orbit_note
description: "Orbit Note, an open-source local-first personal knowledge operating system."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  desktop_drop: ^0.8.4
  drift: ^2.34.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  flutter_riverpod: ^3.4.3
  highlight: ^0.7.0
  markdown: ^7.3.1
  pasteboard: ^0.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  web: ^1.1.1
  yaml: ^3.1.4
  yaml_edit: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
