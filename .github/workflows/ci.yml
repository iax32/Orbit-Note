name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-test:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze

      - name: Set up PDFium for Linux tests
        run: |
          mkdir -p .local
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz" | tar -xz -C .local lib/libpdfium.so
          sudo cp .local/lib/libpdfium.so /usr/local/lib/libpdfium.so
          sudo ldconfig
          FLUTTER_ENGINE_DIR="$(dirname $(which flutter))/cache/artifacts/engine/linux-x64"
          mkdir -p "$FLUTTER_ENGINE_DIR/lib"
          cp .local/lib/libpdfium.so "$FLUTTER_ENGINE_DIR/lib/libpdfium.so"

      - name: Run unit & widget tests
        run: flutter test
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          PDFIUM_PATH: ${{ github.workspace }}/.local/lib/libpdfium.so

