name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze

      - name: Set up PDFium for Linux tests
        run: |
          mkdir -p .local
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz" | tar -xz -C .local lib/libpdfium.so
          sudo cp .local/lib/libpdfium.so /usr/local/lib/libpdfium.so
          sudo ldconfig
          FLUTTER_ENGINE_DIR="$(dirname $(which flutter))/cache/artifacts/engine/linux-x64"
          mkdir -p "$FLUTTER_ENGINE_DIR/lib"
          cp .local/lib/libpdfium.so "$FLUTTER_ENGINE_DIR/lib/libpdfium.so"

      - name: Run unit & widget tests
        run: flutter test
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          PDFIUM_PATH: ${{ github.workspace }}/.local/lib/libpdfium.so

  build-windows:
    name: Compile Windows desktop
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows debug target
        run: flutter build windows --debug

  build-android:
    name: Compile Android debug target
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android debug target
        run: flutter build apk --debug

  build-web:
    name: Compile Web preview
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web preview
        run: flutter build web --release

