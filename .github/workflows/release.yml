name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      google_mode:
        description: Google account preview requires distributor OAuth configuration; Vault sync is unfinished
        type: choice
        default: local-only
        options:
          - local-only
          - google-account-preview

env:
  ORBIT_GOOGLE_BUILD_MODE: ${{ inputs.google_mode || vars.ORBIT_GOOGLE_BUILD_MODE || 'local-only' }}

permissions:
  contents: read

jobs:
  quality-gate:
    name: Release quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "Release tag v$expected does not match pubspec version $actual." >&2
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze

      - name: Set up PDFium for Linux tests
        run: |
          mkdir -p .local
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz" | tar -xz -C .local lib/libpdfium.so
          sudo cp .local/lib/libpdfium.so /usr/local/lib/libpdfium.so
          sudo ldconfig
          FLUTTER_ENGINE_DIR="$(dirname $(which flutter))/cache/artifacts/engine/linux-x64"
          mkdir -p "$FLUTTER_ENGINE_DIR/lib"
          cp .local/lib/libpdfium.so "$FLUTTER_ENGINE_DIR/lib/libpdfium.so"

      - name: Run full test suite
        run: flutter test
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          PDFIUM_PATH: ${{ github.workspace }}/.local/lib/libpdfium.so

  build-windows:
    name: Build Windows x64
    needs: quality-gate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Google build configuration
        env:
          ORBIT_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.ORBIT_GOOGLE_DESKTOP_CLIENT_ID }}
          ORBIT_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.ORBIT_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: dart --packages=.dart_tool/package_config.json tool/prepare_google_build.dart --platform=windows --output=.local/google-build.windows.json

      - name: Build Windows desktop
        run: flutter build windows --release --dart-define-from-file=.local/google-build.windows.json

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath release-assets\OrbitNote-Windows-x64.zip -Force

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release-assets/OrbitNote-Windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release-assets

      - name: Generate release checksum
        shell: bash
        run: sha256sum release-assets/OrbitNote-Windows-x64.zip > release-assets/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/OrbitNote-Windows-x64.zip
            release-assets/SHA256SUMS
          name: Orbit Note ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🪐 Orbit Note ${{ github.ref_name }}

            Google mode: **${{ env.ORBIT_GOOGLE_BUILD_MODE }}**.
            Local-only builds do not enable Google sign-in. Google account preview builds
            support account setup and manual verified backups/restore. Automatic Vault sync
            is not enabled.

            ### 📥 Download Options
            - **Windows (x64)**: Download [`OrbitNote-Windows-x64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OrbitNote-Windows-x64.zip) — extract and run `orbit_note.exe`.

            ### ✨ What's Included
            - Complete linked Markdown editor with live `[[WikiLinks]]`, task lists, visual tables, and LaTeX math.
            - Infinite vector canvas with handwriting, shapes, and object transclusion.
            - Local-first file storage and fast Drift SQLite indexing.
            - Resizable desktop split views and tabs.

            Android and Web remain validation builds, outside the Windows 1.0
            release cut. They will be promoted only after platform acceptance.
